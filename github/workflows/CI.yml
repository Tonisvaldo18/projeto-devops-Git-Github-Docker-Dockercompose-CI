name: Continuous Integration
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: download repository
    - uses: actions/checkout@v3

    - name: builders e up containers
    - run: docker-compose up -d --build
    
    - name: run tests
    - run: | 
            sleep 10
            curl -f http://localhost:5000 | grep "Contador de Visitas"
    

